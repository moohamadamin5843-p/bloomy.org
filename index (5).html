<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomy | فروشگاه لوازم آرایشی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3b2a31;--mute:#8a7078;--pink:#e8769a;--pink2:#fbe3ea;--line:#f3d6df;--ok:#3d9a6b;--warn:#d9822b}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
a{color:inherit;text-decoration:none}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:12px 5vw;background:#fffffff2;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:1.4rem;color:var(--pink);display:flex;align-items:center;gap:6px}
.nav{display:flex;gap:18px;flex:1}
.nav a{padding:2px 4px;border-bottom:2px solid transparent}
.nav a:hover,.nav a.on{border-color:var(--pink)}
.search{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.search input{border:0;padding:6px 14px;font:inherit;outline:0;width:180px;background:transparent}
.search button,.icon-btn{border:0;background:none;cursor:pointer;padding:6px 12px;font:inherit;color:var(--ink)}
.icon-btn{font-size:1.2rem}
main{min-height:60vh;padding:30px 5vw}
h1,h2{margin:.2em 0 .6em}
.hero{background:linear-gradient(135deg,var(--pink2),#fff);border:1px solid var(--line);border-radius:22px;padding:48px 6vw;text-align:center}
.hero h1{font-size:2.2rem;color:var(--pink)}
.btn{display:inline-block;border:0;background:var(--pink);color:#fff;padding:9px 22px;border-radius:999px;font:inherit;cursor:pointer}
.btn.alt{background:#fff;color:var(--pink);border:1px solid var(--pink)}
.btn.del{background:#fff;color:#c0394f;border:1px solid #e9b4bd;padding:5px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card .pic{height:130px;border-radius:12px;background:linear-gradient(135deg,var(--pink2),#fff0f4);display:grid;place-items:center;color:var(--pink);font-size:2.4rem;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:1.05rem}
.price{font-weight:600}
.stock{display:inline-block;margin-top:8px;padding:2px 12px;border-radius:999px;font-size:.85rem;background:#e6f5ec;color:var(--ok)}
.stock.low{background:#fdeedc;color:var(--warn)}.stock.out{background:#fbe1e5;color:#c0394f}
.box{max-width:560px;margin:auto}
.form{display:grid;gap:12px}
input,textarea{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;color:var(--ink)}
label{font-size:.9rem;color:var(--mute)}
.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.msg{color:#c0394f;min-height:1.5em}
.footer{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding:36px 5vw 18px;background:#fff;border-top:1px solid var(--line)}
.footer h3{color:var(--pink);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.footer h4{margin:0 0 6px}
.footer a{display:block}
.footer p{margin:.2em 0}
.copy{grid-column:1/-1;text-align:center;color:var(--mute);border-top:1px solid var(--line);padding-top:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;transition:.3s;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.pre{white-space:pre-line}
@media(max-width:700px){.row{grid-template-columns:1fr 1fr}.nav{order:3;flex-basis:100%}}
</style>
</head>
<body>
<header class="header" id="header">
  <a href="#/" class="logo"><span data-i="flower"></span> Bloomy</a>
  <nav class="nav">
    <a href="#/" data-r="">خانه</a>
    <a href="#/products" data-r="products">محصولات</a>
    <a href="#/about" data-r="about">درباره ما</a>
    <a href="#/contact" data-r="contact">تماس با ما</a>
  </nav>
  <form class="search" id="searchForm">
    <input id="searchInput" type="search" placeholder="جست‌وجوی محصولات...">
    <button type="submit" aria-label="جست‌وجو"><span data-i="search"></span></button>
  </form>
  <div class="actions"><a href="#/account" id="userLink" class="icon-btn" aria-label="حساب کاربری"><span data-i="user"></span></a></div>
</header>

<main id="app"></main>

<footer class="footer">
  <div><h3><span data-i="flower"></span> Bloomy</h3><p id="fDesc"></p></div>
  <div><h4>دسترسی سریع</h4><a href="#/products">محصولات</a><a href="#/about">درباره ما</a><a href="#/contact">تماس با ما</a></div>
  <div><h4>ارتباط با ما</h4>
    <p><span data-i="pin"></span> <span id="fAddr"></span></p>
    <p><span data-i="phone"></span> <span id="fPhone"></span></p>
    <p><span data-i="mail"></span> <span id="fMail"></span></p>
  </div>
  <p class="copy" id="fCopy"></p>
</footer>
<div class="toast" id="toast"></div>

<script>
const ICONS={
flower:'<circle cx="12" cy="12" r="2.5"/><path d="M12 9.5C12 6 13 3.5 12 2c-1 1.5 0 4 0 7.5zM14.5 12c3.5 0 6 1 7.500 0-1.500-1-4-0-7.500 0zM12 14.500c0 3.500-1 6 0 7.500 1-1.500 0-4 0-7.500zM9.500 12C6 12 3.500 11 2 12c1.500 1 4 0 7.500 0z"/>',
search:'<circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6"/>',
pin:'<path d="M12 21s7-6.200 7-11.500A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/>',
phone:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
eye:'<path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
eyeoff:'<path d="M3 3l18 18"/><path d="M10.600 5.100A10 10 0 0 1 12 5c6.500 0 10 7 10 7a17 17 0 0 1-3.200 4M6.600 6.600A17 17 0 0 0 2 12s3.500 7 10 7a9.700 9.700 0 0 0 4-.9"/><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/>',
up:'<path d="M6 15l6-6 6 6"/>',
down:'<path d="M6 9l6 6 6-6"/>',
mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+ICONS[n]+'</svg>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa=n=>Number(n).toLocaleString('fa-IR');
const SALT='bloomy|', ADMIN_HASH='732de987c4a9db36d28b035e88013c2f9ec167e9650839e7d7b65e51d4bb787c';

const DEFAULTS={
  desc:'فروشگاه تخصصی لوازم آرایشی و مراقبت پوست؛ زیبایی، ظریف و اصل.',
  heroTitle:'زیبایی، ظریف و اصل',
  heroText:'بهترین لوازم آرایشی و مراقبت پوست را ببینید و از موجودی هر محصول مطلع شوید.',
  about:'Bloomy فروشگاه تخصصی لوازم آرایشی و مراقبت پوست است.\nما فقط محصولات اصل را با دقت انتخاب و عرضه می‌کنیم.',
  contactText:'برای پرسش درباره محصولات و موجودی، از راه‌های زیر با ما در تماس باشید.',
  address:'تهران، خیابان ولیعصر',phone:'۰۲۱-۱۲۳۴۵۶۷۸',email:'hello@bloomy.ir',
  copy:'© ۱۴۰۴ Bloomy — تمام حقوق محفوظ است.',
  products:[
    {id:1,name:'رژلب مات مخملی',price:420000,stock:14,desc:'ماندگاری بالا و رنگ‌دهی یکدست'},
    {id:2,name:'کرم مرطوب‌کننده',price:690000,stock:3,desc:'مناسب انواع پوست'},
    {id:3,name:'سایه چشم ۹ رنگ',price:560000,stock:0,desc:'پالت رنگ‌های گرم و خنثی'},
    {id:4,name:'ضد آفتاب SPF50',price:480000,stock:22,desc:'سبک و بدون چربی'}]};

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let site=Object.assign({},DEFAULTS,store.get('bloomy_site',{}));
let session=null;try{session=JSON.parse(sessionStorage.getItem('bloomy_session'))}catch(e){}

const normPw=p=>p.trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function hash(pw){
  pw=normPw(pw);
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function paintStatic(){
  document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
  $('#fDesc').textContent=site.desc;$('#fAddr').textContent=site.address;
  $('#fPhone').textContent=site.phone;$('#fMail').textContent=site.email;$('#fCopy').textContent=site.copy;
}
const isAdmin=()=>session&&session.admin===true;

function stockTag(n){
  n=Number(n)||0;
  if(n<=0)return '<span class="stock out">ناموجود</span>';
  if(n<=5)return `<span class="stock low">فقط ${fa(n)} عدد باقی مانده</span>`;
  return `<span class="stock">موجودی: ${fa(n)} عدد</span>`;
}
const cardHtml=p=>`<div class="card"><div class="pic">${ic('flower')}</div><h3>${esc(p.name)}</h3><div>${esc(p.desc)}</div><div class="price">${fa(p.price)} تومان</div>${stockTag(p.stock)}</div>`;

function viewHome(){
  return `<section class="hero"><h1>${esc(site.heroTitle)}</h1><p>${esc(site.heroText)}</p><a class="btn" href="#/products">مشاهده محصولات</a></section>
  <h2 style="margin-top:32px">محصولات</h2><div class="grid">${site.products.slice(0,4).map(cardHtml).join('')}</div>`;
}
function viewProducts(q){
  const list=site.products.filter(p=>!q||(p.name+p.desc).includes(q));
  return `<h2>محصولات${q?` — «${esc(q)}»`:''}</h2>`+(list.length?`<div class="grid">${list.map(cardHtml).join('')}</div>`:'<p>محصولی پیدا نشد.</p>');
}
const viewAbout=()=>`<div class="box"><h2>درباره ما</h2><p class="pre">${esc(site.about)}</p></div>`;
const viewContact=()=>`<div class="box"><h2>تماس با ما</h2><p class="pre">${esc(site.contactText)}</p>
  <p>${ic('pin')} ${esc(site.address)}</p><p>${ic('phone')} ${esc(site.phone)}</p><p>${ic('mail')} ${esc(site.email)}</p></div>`;

function viewAccount(){
  if(!session)return `<div class="box"><h2>ورود / ثبت‌نام</h2><form class="form" id="authForm">
    <div><label>نام</label><input id="aName" autocomplete="username" required></div>
    <div><label>رمز عبور</label><div style="position:relative"><input id="aPass" type="password" autocomplete="current-password" required style="padding-left:44px"><button type="button" id="eyeBtn" class="icon-btn" aria-label="نمایش رمز" style="position:absolute;left:4px;top:50%;transform:translateY(-50%);padding:4px 10px">${ic('eye')}</button></div></div>
    <div class="msg" id="aMsg"></div><button class="btn">ورود / ثبت‌نام</button></form></div>`;
  if(!isAdmin())return `<div class="box"><h2>سلام ${esc(session.name)}</h2><p>برای دیدن محصولات و موجودی به صفحه محصولات بروید.</p>
    <a class="btn" href="#/products">محصولات</a> <button class="btn alt" id="logout">خروج</button></div>`;
  const f=(k,l,ta)=>`<div><label>${l}</label>${ta?`<textarea rows="3" data-k="${k}">${esc(site[k])}</textarea>`:`<input data-k="${k}" value="${esc(site[k])}">`}</div>`;
  return `<div class="box" style="max-width:820px"><h2>پنل مدیریت</h2><p>وارد شده به‌عنوان مدیر: ${esc(session.name)}</p>
  <div class="form card">${f('heroTitle','عنوان صفحه اصلی')}${f('heroText','متن صفحه اصلی',1)}${f('about','درباره ما',1)}${f('contactText','متن تماس با ما',1)}
  ${f('address','نشانی')}${f('phone','تلفن')}${f('email','ایمیل')}${f('desc','توضیح فوتر',1)}${f('copy','متن حقوق')}</div>
  <h3>محصولات و موجودی</h3><div id="plist">${site.products.map((p,i)=>`<div class="row" data-i="${i}">
    <input data-f="name" value="${esc(p.name)}"><input data-f="price" type="number" min="0" value="${p.price}"><input data-f="stock" type="number" min="0" value="${p.stock}"><span style="display:flex;gap:4px"><button class="btn alt" data-mv="-1" data-i2="${i}" aria-label="بالا">${ic('up')}</button><button class="btn alt" data-mv="1" data-i2="${i}" aria-label="پایین">${ic('down')}</button><button class="btn del" data-del="${i}">حذف</button></span></div>`).join('')}</div>
  <button class="btn alt" id="addP">افزودن محصول</button>
  <p><button class="btn" id="saveSite">ذخیره تغییرات</button> <button class="btn alt" id="logout">خروج</button></p></div>`;
}

function collect(){
  document.querySelectorAll('[data-k]').forEach(e=>site[e.dataset.k]=e.value);
  document.querySelectorAll('#plist .row').forEach(r=>{
    const p=site.products[r.dataset.i];if(!p)return;
    r.querySelectorAll('[data-f]').forEach(e=>p[e.dataset.f]=e.dataset.f==='name'?e.value:Math.max(0,Number(e.value)||0));
  });
}
function bindAccount(){
  const af=$('#authForm');
  if(af)af.onsubmit=async e=>{
    e.preventDefault();
    const name=$('#aName').value.trim(),pw=$('#aPass').value,h=await hash(pw),users=store.get('bloomy_users',{});
    if(!name||!pw){$('#aMsg').textContent='نام و رمز را وارد کنید.';return}
    if(users[name]&&users[name]!==h&&h!==ADMIN_HASH){$('#aMsg').textContent='رمز عبور درست نیست.';return}
    if(!users[name]){users[name]=h;store.set('bloomy_users',users)}
    session={name,admin:h===ADMIN_HASH};
    sessionStorage.setItem('bloomy_session',JSON.stringify(session));
    toast('خوش آمدید');route();
  };
  const eb=$('#eyeBtn');if(eb)eb.onclick=()=>{const p=$('#aPass'),show=p.type==='password';p.type=show?'text':'password';eb.innerHTML=ic(show?'eyeoff':'eye');eb.setAttribute('aria-label',show?'پنهان کردن رمز':'نمایش رمز')};
  const lo=$('#logout');if(lo)lo.onclick=()=>{session=null;sessionStorage.removeItem('bloomy_session');route()};
  const sv=$('#saveSite');if(sv){
    sv.onclick=()=>{collect();store.set('bloomy_site',site);paintStatic();toast('ذخیره شد')};
    $('#addP').onclick=()=>{collect();site.products.push({id:Date.now(),name:'محصول جدید',price:0,stock:0,desc:''});route()};
    document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{collect();const i=+b.dataset.i2,j=i+ +b.dataset.mv,a=site.products;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];route()});
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();site.products.splice(b.dataset.del,1);route()});
  }
}
function route(){
  const raw=location.hash.replace(/^#\/?/,''),[page,qs]=raw.split('?'),q=new URLSearchParams(qs||'').get('q')||'';
  const views={'':viewHome,products:()=>viewProducts(q),about:viewAbout,contact:viewContact,account:viewAccount};
  $('#app').innerHTML=(views[page]||viewHome)();
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===page));
  bindAccount();window.scrollTo(0,0);
}
$('#searchForm').onsubmit=e=>{e.preventDefault();location.hash='#/products?q='+encodeURIComponent($('#searchInput').value.trim())};
addEventListener('hashchange',route);
paintStatic();route();
</script>
</body>
</html>
